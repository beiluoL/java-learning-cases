# Attu 可视化（Milvus 官方 GUI）
# 用法：在 infra/docker/ 目录下执行
#   docker compose -f attu-compose.yml up -d      # 启动
#   docker compose -f attu-compose.yml down       # 停止并删除容器
#
# 说明：
# - Attu 与 Milvus 必须在同一个 Docker 网络（这里复用 milvus-standalone 创建的 `milvus` 网络），
#   这样 Attu 才能用容器名 `milvus-standalone` 解析到 Milvus。
# - 本机已先启动 Milvus（infra/docker/milvus-standalone-docker-compose.yml），
#   其 standalone 容器名就是 `milvus-standalone`，故 MILVUS_URL 直接写 milvus-standalone:19530。
# - 端口映射 9530:3000 含义：宿主机的 9530 → Attu 容器内部默认 3000 端口。
#   浏览器访问 http://127.0.0.1:9530 即可打开 Attu 管理界面。

services:
  attu:
    image: zilliz/attu:v2.5.11
    container_name: attu
    # 关键：加入 Milvus 的网络，才能用容器名访问 Milvus
    networks:
      - milvus
    # 端口映射：宿主 9530 -> 容器 3000（Attu 容器内监听 3000）
    ports:
      - "9530:3000"
    # 后端连接 Milvus 的地址：容器名 + gRPC 端口 19530
    environment:
      MILVUS_URL: milvus-standalone:19530
    # 注意：milvus-standalone 由另一个 compose 文件创建，不能写 depends_on，
    # 否则 `docker compose config` 会报 "depends on undefined service"。
    # 前置条件：先执行 `docker compose -f milvus-standalone-docker-compose.yml up -d`，
    # 并等待 milvus-standalone 健康检查为 healthy，再启动本文件。
    restart: unless-stopped

# 复用 Milvus standalone 创建的外部网络（不要新建，否则连不上 Milvus）
networks:
  milvus:
    external: true
    name: milvus
