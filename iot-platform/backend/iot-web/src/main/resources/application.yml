server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: iot-platform
  datasource:
    url: jdbc:h2:./data/iotdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# MQTT 客户端连接配置（内嵌 Broker 默认监听 1883）
iot:
  mqtt:
    host: localhost
    port: 1883
    client-id-prefix: iot-platform-backend
    keep-alive: 30
    connection-timeout: 10
    automatic-reconnect: true

logging:
  level:
    com.iot.bigdata: INFO
    io.moquette: WARN
    org.eclipse.paho: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
