<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 820" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .box   { fill:#e6f4ff; stroke:#1677ff; stroke-width:1.5; }
    .entry { fill:#1677ff; stroke:#1677ff; stroke-width:1.5; }
    .term  { fill:#f6ffed; stroke:#52c41a; stroke-width:1.5; }
    .sub   { fill:#f0f5ff; stroke:#91caff; stroke-width:1.2; }
    .title { fill:#1f1f1f; font-size:15px; font-weight:700; }
    .t     { fill:#1f1f1f; font-size:13px; font-weight:600; }
    .s     { fill:#555; font-size:11px; }
    .tw    { fill:#ffffff; font-size:13px; font-weight:600; }
    .sw    { fill:#ffffff; font-size:11px; }
    .ln    { stroke:#1677ff; stroke-width:2; fill:none; }
    .ln2   { stroke:#91caff; stroke-width:1.5; fill:none; }
    .cap   { fill:#888; font-size:12px; }
    .k     { fill:#1677ff; font-size:12px; font-weight:700; }
  </style>

  <text x="390" y="30" text-anchor="middle" class="title">配置解析流程：XML → Configuration → SqlSessionFactory</text>

  <rect class="entry" x="250" y="46" width="280" height="48" rx="10"/>
  <text x="390" y="68" text-anchor="middle" class="tw">SqlSessionFactoryBuilder.build(InputStream)</text>
  <text x="390" y="86" text-anchor="middle" class="sw">读取 mini-mybatis-config.xml</text>

  <rect class="box" x="250" y="120" width="280" height="48" rx="10"/>
  <text x="390" y="142" text-anchor="middle" class="t">XMLConfigBuilder.parse()</text>
  <text x="390" y="160" text-anchor="middle" class="s">DOM 解析，逐节点翻译成 Java 对象</text>

  <!-- 五个子节点 -->
  <rect class="sub" x="40"  y="200" width="150" height="44" rx="8"/>
  <text x="115" y="222" text-anchor="middle" class="s" font-weight="600">settings</text>
  <text x="115" y="238" text-anchor="middle" class="s">缓存/驼峰/SQL日志</text>

  <rect class="sub" x="220" y="200" width="150" height="44" rx="8"/>
  <text x="295" y="222" text-anchor="middle" class="s" font-weight="600">typeAliases</text>
  <text x="295" y="238" text-anchor="middle" class="s">User / Order 短名</text>

  <rect class="sub" x="400" y="200" width="150" height="44" rx="8"/>
  <text x="475" y="222" text-anchor="middle" class="s" font-weight="600">plugins</text>
  <text x="475" y="238" text-anchor="middle" class="s">拦截器链(插件)</text>

  <rect class="sub" x="580" y="200" width="160" height="44" rx="8"/>
  <text x="660" y="222" text-anchor="middle" class="s" font-weight="600">environments</text>
  <text x="660" y="238" text-anchor="middle" class="s">事务工厂+数据源</text>

  <rect class="sub" x="290" y="262" width="200" height="44" rx="8"/>
  <text x="390" y="284" text-anchor="middle" class="s" font-weight="600">mappers</text>
  <text x="390" y="300" text-anchor="middle" class="s">注册 SQL（XML / 注解）</text>

  <!-- 主线箭头 -->
  <line class="ln" x1="390" y1="94" x2="390" y2="118"/>
  <line class="ln2" x1="390" y1="168" x2="115" y2="198"/>
  <line class="ln2" x1="390" y1="168" x2="295" y2="198"/>
  <line class="ln2" x1="390" y1="168" x2="475" y2="198"/>
  <line class="ln2" x1="390" y1="168" x2="660" y2="198"/>
  <line class="ln"  x1="390" y1="168" x2="390" y2="260"/>

  <!-- environments -> Environment -->
  <rect class="box" x="560" y="320" width="200" height="48" rx="10"/>
  <text x="660" y="342" text-anchor="middle" class="t">Environment</text>
  <text x="660" y="360" text-anchor="middle" class="s">JdbcTransactionFactory</text>
  <text x="660" y="374" text-anchor="middle" class="s">+ PooledDataSource</text>
  <line class="ln2" x1="660" y1="244" x2="660" y2="318"/>

  <!-- mappers -> 两个 builder -->
  <rect class="box" x="40" y="360" width="240" height="48" rx="10"/>
  <text x="160" y="382" text-anchor="middle" class="t">XMLMapperBuilder.parse()</text>
  <text x="160" y="400" text-anchor="middle" class="s">逐条 &lt;select|insert|...&gt;</text>

  <rect class="box" x="300" y="360" width="240" height="48" rx="10"/>
  <text x="420" y="382" text-anchor="middle" class="t">MapperAnnotationBuilder</text>
  <text x="420" y="400" text-anchor="middle" class="s">解析 @Select/@Insert/...</text>

  <line class="ln" x1="390" y1="306" x2="160" y2="358"/>
  <line class="ln" x1="390" y1="306" x2="420" y2="358"/>

  <!-- XML -> XMLScriptBuilder -> SqlSource -->
  <rect class="sub" x="40" y="448" width="240" height="44" rx="8"/>
  <text x="160" y="470" text-anchor="middle" class="s" font-weight="600">XMLScriptBuilder</text>
  <text x="160" y="486" text-anchor="middle" class="s">SqlNode 树 / #{}/${}</text>

  <rect class="sub" x="300" y="448" width="240" height="44" rx="8"/>
  <text x="420" y="470" text-anchor="middle" class="s" font-weight="600">注解方法体</text>
  <text x="420" y="486" text-anchor="middle" class="s">value() -> SqlSource</text>

  <line class="ln2" x1="160" y1="408" x2="160" y2="446"/>
  <line class="ln2" x1="420" y1="408" x2="420" y2="446"/>

  <!-- SqlSource -> MappedStatement -->
  <rect class="box" x="170" y="532" width="260" height="48" rx="10"/>
  <text x="300" y="554" text-anchor="middle" class="t">MappedStatement</text>
  <text x="300" y="572" text-anchor="middle" class="s">SQL + 参数/结果映射 + 缓存</text>
  <line class="ln" x1="160" y1="492" x2="280" y2="530"/>
  <line class="ln" x1="420" y1="492" x2="320" y2="530"/>

  <!-- 汇总 Configuration -->
  <rect class="box" x="120" y="620" width="360" height="50" rx="10"/>
  <text x="300" y="642" text-anchor="middle" class="t">Configuration（全局配置中心）</text>
  <text x="300" y="660" text-anchor="middle" class="s">MappedStatement 注册表 + 类型/别名/插件/缓存</text>
  <line class="ln" x1="300" y1="580" x2="300" y2="618"/>
  <line class="ln2" x1="660" y1="368" x2="660" y2="600" stroke-dasharray="5 4"/>
  <line class="ln2" x1="660" y1="600" x2="480" y2="645" stroke-dasharray="5 4"/>
  <text x="620" y="595" text-anchor="middle" class="k">Environment</text>

  <!-- 产出 -->
  <rect class="term" x="250" y="710" width="280" height="50" rx="10"/>
  <text x="390" y="732" text-anchor="middle" class="t">DefaultSqlSessionFactory</text>
  <text x="390" y="750" text-anchor="middle" class="s">openSession() -> SqlSession</text>
  <line class="ln" x1="300" y1="670" x2="390" y2="708"/>

  <text x="390" y="800" text-anchor="middle" class="cap">XML 节点 → Java 对象；每个 &lt;select&gt;/注解 → 一个 MappedStatement，统一收口到 Configuration</text>
</svg>
