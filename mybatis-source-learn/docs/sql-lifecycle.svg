<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1000" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <style>
    .box   { fill:#e6f4ff; stroke:#1677ff; stroke-width:1.5; rx:10; }
    .entry { fill:#1677ff; stroke:#1677ff; stroke-width:1.5; rx:10; }
    .term  { fill:#f6ffed; stroke:#52c41a; stroke-width:1.5; rx:10; }
    .l2    { fill:#fff7e6; stroke:#fa8c16; stroke-width:1.5; rx:10; }
    .l1    { fill:#f9f0ff; stroke:#722ed1; stroke-width:1.5; rx:10; }
    .title { fill:#1f1f1f; font-size:15px; font-weight:700; }
    .t     { fill:#1f1f1f; font-size:13px; font-weight:600; }
    .s     { fill:#555; font-size:11px; }
    .tw    { fill:#ffffff; font-size:13px; font-weight:600; }
    .sw    { fill:#ffffff; font-size:11px; }
    .ret   { fill:#fff1f0; stroke:#f5222d; stroke-width:1.5; rx:10; }
    .rt    { fill:#cf1322; font-size:13px; font-weight:700; }
    .ln    { stroke:#1677ff; stroke-width:2; fill:none; }
    .dash  { stroke:#fa541c; stroke-width:1.8; fill:none; stroke-dasharray:6 4; }
    .lab   { fill:#fa541c; font-size:11px; font-weight:600; }
    .cap   { fill:#888; font-size:12px; }
  </style>

  <text x="390" y="30" text-anchor="middle" class="title">一次查询的完整源码链路（SQL 执行生命周期）</text>

  <!-- 主链路 -->
  <rect class="entry" x="210" y="46"  width="360" height="50" rx="10"/>
  <text x="390" y="68" text-anchor="middle" class="tw">① SqlSession.selectList(statement, param)</text>
  <text x="390" y="86" text-anchor="middle" class="sw">门面入口：把请求转给 Executor</text>

  <rect class="box" x="210" y="120" width="360" height="50" rx="10"/>
  <text x="390" y="142" text-anchor="middle" class="t">② MapperProxy.invoke()</text>
  <text x="390" y="160" text-anchor="middle" class="s">JDK 动态代理：接口无实现类也能执行</text>

  <rect class="box" x="210" y="194" width="360" height="50" rx="10"/>
  <text x="390" y="216" text-anchor="middle" class="t">③ MapperMethod.execute()</text>
  <text x="390" y="234" text-anchor="middle" class="s">按 SELECT/INSERT/... 分发 + 参数封装</text>

  <rect class="l2" x="210" y="268" width="360" height="50" rx="10"/>
  <text x="390" y="290" text-anchor="middle" class="t">④ CachingExecutor.query()　查二级缓存(L2)</text>
  <text x="390" y="308" text-anchor="middle" class="s">跨 SqlSession 共享，namespace 级，commit 后生效</text>

  <rect class="l1" x="210" y="342" width="360" height="50" rx="10"/>
  <text x="390" y="364" text-anchor="middle" class="t">⑤ BaseExecutor.query()　查一级缓存(L1)</text>
  <text x="390" y="382" text-anchor="middle" class="s">同一 SqlSession 内有效，会话级</text>

  <rect class="box" x="210" y="416" width="360" height="50" rx="10"/>
  <text x="390" y="438" text-anchor="middle" class="t">⑥ SimpleExecutor.doQuery()</text>
  <text x="390" y="456" text-anchor="middle" class="s">模板方法：真正和 JDBC 打交道</text>

  <rect class="box" x="210" y="490" width="360" height="50" rx="10"/>
  <text x="390" y="512" text-anchor="middle" class="t">⑦ Configuration.newStatementHandler()</text>
  <text x="390" y="530" text-anchor="middle" class="s">创建 PreparedStatementHandler（+ 插件代理)</text>

  <rect class="box" x="210" y="564" width="360" height="50" rx="10"/>
  <text x="390" y="586" text-anchor="middle" class="t">⑧ DefaultParameterHandler.setParameters()</text>
  <text x="390" y="604" text-anchor="middle" class="s">#{} -> ? ，TypeHandler 把 Java 值设进 PreparedStatement</text>

  <rect class="box" x="210" y="638" width="360" height="50" rx="10"/>
  <text x="390" y="660" text-anchor="middle" class="t">⑨ PreparedStatementHandler.query()</text>
  <text x="390" y="678" text-anchor="middle" class="s">ps.execute() 真正打到数据库</text>

  <rect class="box" x="210" y="712" width="360" height="50" rx="10"/>
  <text x="390" y="734" text-anchor="middle" class="t">⑩ DefaultResultSetHandler.handleResultSets()</text>
  <text x="390" y="752" text-anchor="middle" class="s">ResultSet -> 实体（反射 + TypeHandler + 驼峰映射）</text>

  <rect class="term" x="210" y="786" width="360" height="50" rx="10"/>
  <text x="390" y="808" text-anchor="middle" class="t">⑪ 返回 List&lt;E&gt;，并写入 L1 / L2 缓存</text>
  <text x="390" y="826" text-anchor="middle" class="s">结果逐层返回，缓存装饰器刷新</text>

  <!-- 返回终端（左侧） -->
  <rect class="ret" x="24" y="430" width="150" height="80" rx="10"/>
  <text x="99" y="462" text-anchor="middle" class="rt">返回结果</text>
  <text x="99" y="484" text-anchor="middle" class="s">List / 实体 / 行数</text>

  <!-- 主线箭头 -->
  <line class="ln" x1="390" y1="96"  x2="390" y2="118"/>
  <line class="ln" x1="390" y1="170" x2="390" y2="192"/>
  <line class="ln" x1="390" y1="244" x2="390" y2="266"/>
  <line class="ln" x1="390" y1="318" x2="390" y2="340"/>
  <line class="ln" x1="390" y1="392" x2="390" y2="414"/>
  <line class="ln" x1="390" y1="466" x2="390" y2="488"/>
  <line class="ln" x1="390" y1="540" x2="390" y2="562"/>
  <line class="ln" x1="390" y1="614" x2="390" y2="636"/>
  <line class="ln" x1="390" y1="688" x2="390" y2="710"/>
  <line class="ln" x1="390" y1="762" x2="390" y2="784"/>

  <!-- L2 命中直接返回 -->
  <path class="dash" d="M 210 293 C 150 293, 120 430, 174 430"/>
  <text x="150" y="360" text-anchor="middle" class="lab">L2 命中→直接返回</text>

  <!-- L1 命中直接返回 -->
  <path class="dash" d="M 210 367 C 165 367, 150 470, 174 470"/>
  <text x="150" y="425" text-anchor="middle" class="lab">L1 命中→直接返回</text>

  <!-- 末端返回 -->
  <path class="dash" d="M 210 811 C 150 811, 120 510, 174 510"/>
  <text x="150" y="690" text-anchor="middle" class="lab">结果逐层返回</text>

  <text x="390" y="980" text-anchor="middle" class="cap">蓝色=核心流程　橙框=二级缓存　紫框=一级缓存　虚线=缓存命中短路</text>
</svg>
