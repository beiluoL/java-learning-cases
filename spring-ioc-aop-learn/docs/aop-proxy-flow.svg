<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box { fill:#EAF2FB; stroke:#1677ff; stroke-width:1.5; }
      .box2 { fill:#F6FFED; stroke:#389e0d; stroke-width:1.5; }
      .box3 { fill:#FFF7E6; stroke:#d48806; stroke-width:1.5; }
      .box4 { fill:#F9F0FF; stroke:#722ed1; stroke-width:1.5; }
      .title { fill:#1677ff; font-size:18px; font-weight:700; }
      .h { fill:#1f2329; font-size:14px; font-weight:700; }
      .t { fill:#3a3f47; font-size:12px; }
      .arrow { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="340" y="30" text-anchor="middle" class="title">AOP 动态代理流程：从目标对象到拦截器链</text>

  <!-- inputs -->
  <rect x="40" y="55" width="180" height="54" class="box2"/>
  <text x="130" y="78" text-anchor="middle" class="h">目标对象 Target</text>
  <text x="130" y="96" text-anchor="middle" class="t">userService / orderService</text>

  <rect x="460" y="55" width="180" height="54" class="box4"/>
  <text x="550" y="78" text-anchor="middle" class="h">Advisor</text>
  <text x="550" y="96" text-anchor="middle" class="t">Pointcut(切点) + Advice(通知)</text>

  <path d="M220,82 L330,82" class="arrow"/>
  <path d="M460,82 L350,82" class="arrow"/>

  <!-- ProxyFactory -->
  <rect x="250" y="135" width="180" height="54" class="box"/>
  <text x="340" y="158" text-anchor="middle" class="h">ProxyFactory</text>
  <text x="340" y="176" text-anchor="middle" class="t">setTarget + addAdvisor</text>

  <path d="M340,109 L340,135" class="arrow"/>

  <!-- choose proxy -->
  <rect x="250" y="215" width="180" height="48" class="box3"/>
  <text x="340" y="244" text-anchor="middle" class="h">选择代理方式</text>

  <path d="M340,189 L340,215" class="arrow"/>

  <!-- two branches -->
  <rect x="40" y="290" width="240" height="64" class="box"/>
  <text x="160" y="314" text-anchor="middle" class="h">JDK 动态代理</text>
  <text x="160" y="333" text-anchor="middle" class="t">Proxy.newProxyInstance</text>
  <text x="160" y="349" text-anchor="middle" class="t">要求目标实现接口</text>

  <rect x="400" y="290" width="240" height="64" class="box"/>
  <text x="520" y="314" text-anchor="middle" class="h">CGLIB 动态代理</text>
  <text x="520" y="333" text-anchor="middle" class="t">Enhancer 生成子类</text>
  <text x="520" y="349" text-anchor="middle" class="t">基于继承，无需接口</text>

  <path d="M300,239 L160,290" class="arrow"/>
  <path d="M380,239 L520,290" class="arrow"/>

  <!-- AopProxy.getProxy -->
  <rect x="220" y="385" width="240" height="50" class="box2"/>
  <text x="340" y="415" text-anchor="middle" class="h">AopProxy.getProxy() → Proxy</text>

  <path d="M160,354 L300,385" class="arrow"/>
  <path d="M520,354 L380,385" class="arrow"/>

  <!-- chain -->
  <rect x="40" y="460" width="600" height="74" class="box4"/>
  <text x="340" y="484" text-anchor="middle" class="h">方法调用 → ReflectiveMethodInvocation（拦截器链）</text>
  <text x="340" y="506" text-anchor="middle" class="t">前置通知 → 环绕通知 → 后置返回通知 → 异常通知 → 目标方法 (proceed 到链尾才执行)</text>
  <text x="340" y="524" text-anchor="middle" class="t">各 Advice 在 AdvisedSupport 中统一“适配”为 MethodInterceptor 串成链</text>

  <path d="M340,435 L340,460" class="arrow"/>
</svg>
