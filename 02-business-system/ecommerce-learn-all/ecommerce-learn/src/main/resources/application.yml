server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 100

spring:
  application:
    name: ecommerce-learn
  profiles:
    active: dev
  # 时区与 Jackson 序列化（企业级常见配置）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  # 数据源（生产建议用 Druid/Hikari 调优）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ecommerce_learn?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
  # Redis 缓存 / 秒杀 / 分布式锁
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ecommerce.learn.module.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID   # 雪花算法，分布式友好
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 接口文档
knife4j:
  enable: true
  openapi:
    title: 电商学习项目 API
    version: 1.0.0
    description: 商品 / 订单 / 购物车 / 用户 / 秒杀 / 后台
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.ecommerce.learn.module

# JWT 配置（生产请通过环境变量或配置中心注入 secret）
jwt:
  secret: ecommerce-learn-secret-key-2026-change-me-please-32bytes
  issuer: ecommerce-learn
  access-token-ttl: 7200        # 访问令牌有效期（秒）
  refresh-token-ttl: 604800     # 刷新令牌有效期（秒）

# 分布式事务 Seata（AT 模式，需启动 seata-server）
# 默认关闭，保证无 Seata 时应用也能正常启动；启用分布式事务时改为 true 并启动 seata-server
seata:
  enabled: false
  application-id: ${spring.application.name}
  tx-service-group: ecommerce_tx_group
  service:
    vgroup-mapping:
      ecommerce_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  config:
    type: file
  registry:
    type: file
  enable-auto-data-source-proxy: false

# 自定义业务配置
app:
  seckill:
    # 秒杀下单后异步落库队列名（示意）
    async-queue: seckill_order_queue
  pay:
    # 支付渠道回调地址（示意，真实接入需公网可访问）
    alipay-notify-url: http://localhost:8080/api/pay/alipay/notify
    wechat-notify-url: http://localhost:8080/api/pay/wechat/notify
