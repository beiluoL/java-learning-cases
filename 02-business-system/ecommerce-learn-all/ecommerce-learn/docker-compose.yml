version: '3.8'

# 一键拉起依赖：MySQL / Redis / Seata（分布式事务可选）
# 用法：docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_learn
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 分布式事务协调器（启用 Seata 全局事务时才需要）
  seata:
    image: seataio/seata-server:2.1.0
    container_name: ecommerce-seata
    environment:
      SEATA_IP: 127.0.0.1
    ports:
      - "8091:8091"

volumes:
  mysql-data:
