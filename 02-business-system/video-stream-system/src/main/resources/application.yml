server:
  port: 8080
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: video-stream-system
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/video_stream?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transcode-worker
      enable-auto-commit: false
      max-poll-records: 10
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

# ===== 对象存储（S3 兼容：可对接 AWS S3 / 阿里云 OSS S3 接口 / 腾讯云 COS） =====
object-storage:
  endpoint: ${OSS_ENDPOINT:https://s3.amazonaws.com}
  region: ${OSS_REGION:us-east-1}
  bucket: ${OSS_BUCKET:video-stream-bucket}
  access-key: ${OSS_ACCESS_KEY:}
  secret-key: ${OSS_SECRET_KEY:}
  # 全球上传加速（云厂商「传输加速」端点，可选）
  accelerate-endpoint: ${OSS_ACCELERATE_ENDPOINT:}

# ===== FFmpeg（转码 Worker 节点本地需安装 ffmpeg） =====
ffmpeg:
  path: ${FFMPEG_PATH:/usr/bin/ffmpeg}
  # 单 Worker 并发转码任务数（GPU 卡按显存调整，CPU 按核数）
  max-concurrent: 4
  # 是否启用 GPU 硬件编码（NVIDIA NVENC）
  gpu-enabled: ${FFMPEG_GPU:false}
  gpu-index: 0

# ===== 转码档位（多清晰度） =====
transcode:
  profiles:
    - name: "1080p"
      width: 1920
      height: 1080
      video-codec: "libx264"
      video-bitrate: "4000k"
      audio-bitrate: "128k"
      tier: 1
    - name: "720p"
      width: 1280
      height: 720
      video-codec: "libx264"
      video-bitrate: "2000k"
      audio-bitrate: "96k"
      tier: 2
    - name: "480p"
      width: 854
      height: 480
      video-codec: "libx264"
      video-bitrate: "1000k"
      audio-bitrate: "64k"
      tier: 3
    - name: "360p"
      width: 640
      height: 360
      video-codec: "libx264"
      video-bitrate: "600k"
      audio-bitrate: "48k"
      tier: 4

# ===== CDN 多节点调度 =====
cdn:
  # 区域 -> CDN 域名（边缘就近接入）
  region-domains:
    AP: "https://ap.cdn.example.com"
    EU: "https://eu.cdn.example.com"
    US: "https://us.cdn.example.com"
    DEFAULT: "https://cdn.example.com"
  # 播放鉴权签名密钥（HMAC-SHA256）
  sign-secret: ${CDN_SIGN_SECRET:change-me-secret}
  default-ttl-seconds: 3600

# ===== 日志 =====
logging:
  level:
    com.example.videostream: INFO
    org.springframework.kafka: WARN
