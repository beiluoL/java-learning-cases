<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="460" height="520" fill="#f7f9fc"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1677ff">回调验签与幂等处理</text>

  <!-- start -->
  <rect x="150" y="44" width="160" height="36" rx="18" fill="#e6f0ff" stroke="#1677ff"/>
  <text x="230" y="67" font-size="12" text-anchor="middle" fill="#333">收到渠道回调</text>

  <rect x="150" y="104" width="160" height="36" rx="6" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="230" y="127" font-size="12" text-anchor="middle" fill="#333">用渠道公钥验签</text>

  <rect x="150" y="164" width="160" height="36" rx="6" fill="#f9f0ff" stroke="#722ed1"/>
  <text x="230" y="187" font-size="12" text-anchor="middle" fill="#333">解析为 ChannelCallback</text>

  <!-- decision -->
  <polygon points="230,224 300,256 230,288 160,256" fill="#fff1f0" stroke="#cf1322"/>
  <text x="230" y="252" font-size="11" text-anchor="middle" fill="#333">订单已</text>
  <text x="230" y="266" font-size="11" text-anchor="middle" fill="#333">终态?</text>

  <rect x="40" y="320" width="150" height="36" rx="6" fill="#f6ffed" stroke="#52c41a"/>
  <text x="115" y="343" font-size="11" text-anchor="middle" fill="#333">直接返回 success</text>

  <rect x="280" y="320" width="150" height="36" rx="6" fill="#e6fffb" stroke="#13c2c2"/>
  <text x="355" y="343" font-size="11" text-anchor="middle" fill="#333">更新状态+落库</text>

  <rect x="280" y="396" width="150" height="36" rx="6" fill="#fafafa" stroke="#bbb"/>
  <text x="355" y="419" font-size="11" text-anchor="middle" fill="#333">返回 success</text>

  <!-- fail branch -->
  <rect x="40" y="396" width="150" height="36" rx="6" fill="#fff1f0" stroke="#f5222d"/>
  <text x="115" y="419" font-size="11" text-anchor="middle" fill="#333">验签失败→返回 fail</text>

  <!-- edges -->
  <line x1="230" y1="80" x2="230" y2="102" stroke="#999"/>
  <line x1="230" y1="140" x2="230" y2="162" stroke="#999"/>
  <line x1="230" y1="200" x2="230" y2="222" stroke="#999"/>
  <line x1="160" y1="256" x2="115" y2="318" stroke="#999"/>
  <line x1="300" y1="256" x2="355" y2="318" stroke="#999"/>
  <line x1="355" y1="356" x2="355" y2="394" stroke="#999"/>
  <line x1="115" y1="356" x2="115" y2="394" stroke="#999"/>
  <text x="170" y="300" font-size="10" fill="#cf1322">是</text>
  <text x="320" y="300" font-size="10" fill="#13c2c2">否</text>
</svg>
