<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="620" height="360" fill="#f7f9fc"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1677ff">TCC 分布式事务时序（银行转账）</text>

  <rect x="20" y="60" width="110" height="34" rx="6" fill="#e6f0ff" stroke="#1677ff"/>
  <text x="75" y="82" font-size="11" text-anchor="middle" fill="#333">协调器</text>
  <rect x="180" y="60" width="130" height="34" rx="6" fill="#f6ffed" stroke="#52c41a"/>
  <text x="245" y="82" font-size="11" text-anchor="middle" fill="#333">转出账户服务</text>
  <rect x="400" y="60" width="130" height="34" rx="6" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="465" y="82" font-size="11" text-anchor="middle" fill="#333">收款账户服务</text>

  <line x1="75" y1="94" x2="75" y2="330" stroke="#ccc"/>
  <line x1="245" y1="94" x2="245" y2="330" stroke="#ccc"/>
  <line x1="465" y1="94" x2="465" y2="330" stroke="#ccc"/>

  <g font-size="11" fill="#333">
    <line x1="75" y1="120" x2="243" y2="120" stroke="#52c41a" marker-end="url(#ar)"/>
    <text x="100" y="114">1 Try: 冻结金额</text>
    <line x1="245" y1="150" x2="77" y2="150" stroke="#52c41a" marker-end="url(#ar)"/>
    <text x="100" y="144">1.1 余额-额, 冻结+额</text>

    <line x1="75" y1="190" x2="463" y2="190" stroke="#fa8c16" marker-end="url(#ar)"/>
    <text x="280" y="184">2 Confirm: 入账款</text>
    <line x1="465" y1="220" x2="77" y2="220" stroke="#fa8c16" marker-end="url(#ar)"/>
    <text x="300" y="214">2.1 释放冻结, 对方余额+额</text>

    <rect x="230" y="250" width="160" height="30" rx="6" fill="#f6ffed" stroke="#52c41a"/>
    <text x="310" y="270" font-size="11" text-anchor="middle" fill="#333">全部 Confirm → 一致</text>

    <line x1="245" y1="300" x2="77" y2="300" stroke="#cf1322" marker-end="url(#ar)"/>
    <text x="90" y="294" fill="#cf1322">3 (异常) Cancel: 回滚冻结</text>
    <rect x="230" y="312" width="200" height="28" rx="6" fill="#fff1f0" stroke="#cf1322"/>
    <text x="330" y="331" font-size="10" text-anchor="middle" fill="#cf1322">Cancel → 余额加回, 冻结释放</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
