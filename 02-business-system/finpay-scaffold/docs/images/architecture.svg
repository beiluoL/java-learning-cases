<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="760" height="360" fill="#f7f9fc"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1677ff">FinPay 整体架构</text>

  <!-- Client -->
  <rect x="20" y="70" width="110" height="46" rx="8" fill="#e6f0ff" stroke="#1677ff"/>
  <text x="75" y="98" font-size="12" text-anchor="middle" fill="#333">Vue 管理后台</text>

  <!-- Gateway -->
  <rect x="180" y="70" width="120" height="46" rx="8" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="240" y="98" font-size="12" text-anchor="middle" fill="#333">API 网关</text>
  <text x="240" y="114" font-size="10" text-anchor="middle" fill="#999">路由/鉴权/限流</text>

  <!-- Business -->
  <rect x="360" y="50" width="140" height="60" rx="8" fill="#f6ffed" stroke="#52c41a"/>
  <text x="430" y="78" font-size="12" text-anchor="middle" fill="#333">业务服务</text>
  <text x="430" y="96" font-size="10" text-anchor="middle" fill="#999">支付网关示例</text>
  <text x="430" y="108" font-size="10" text-anchor="middle" fill="#999">银行交易系统</text>

  <!-- Payment Core -->
  <rect x="360" y="140" width="140" height="60" rx="8" fill="#f9f0ff" stroke="#722ed1"/>
  <text x="430" y="166" font-size="12" text-anchor="middle" fill="#333">统一支付核心</text>
  <text x="430" y="184" font-size="10" text-anchor="middle" fill="#999">渠道工厂/门面</text>

  <!-- Channels -->
  <rect x="560" y="60" width="170" height="40" rx="8" fill="#fff1f0" stroke="#f5222d"/>
  <text x="645" y="85" font-size="12" text-anchor="middle" fill="#333">支付宝渠道</text>
  <rect x="560" y="110" width="170" height="40" rx="8" fill="#fff1f0" stroke="#f5222d"/>
  <text x="645" y="135" font-size="12" text-anchor="middle" fill="#333">微信支付渠道</text>

  <!-- Security / Job / DB -->
  <rect x="360" y="230" width="140" height="44" rx="8" fill="#e6fffb" stroke="#13c2c2"/>
  <text x="430" y="257" font-size="12" text-anchor="middle" fill="#333">安全模块</text>
  <rect x="180" y="230" width="140" height="44" rx="8" fill="#fffbe6" stroke="#faad14"/>
  <text x="250" y="257" font-size="12" text-anchor="middle" fill="#333">对账/任务</text>
  <rect x="20" y="230" width="130" height="44" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="85" y="257" font-size="12" text-anchor="middle" fill="#333">MySQL / Redis</text>

  <!-- edges -->
  <line x1="130" y1="93" x2="178" y2="93" stroke="#999"/>
  <line x1="300" y1="93" x2="358" y2="80" stroke="#999"/>
  <line x1="430" y1="110" x2="430" y2="138" stroke="#999"/>
  <line x1="500" y1="80" x2="558" y2="80" stroke="#999"/>
  <line x1="500" y1="95" x2="558" y2="130" stroke="#999"/>
  <line x1="430" y1="200" x2="430" y2="228" stroke="#999"/>
  <line x1="320" y1="252" x2="182" y2="252" stroke="#999"/>
  <line x1="150" y1="252" x2="150" y2="252" stroke="#999"/>
  <text x="92" y="252" font-size="10" text-anchor="middle" fill="#bbb">持久化</text>
</svg>
