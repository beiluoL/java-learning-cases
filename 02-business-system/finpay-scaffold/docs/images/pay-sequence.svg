<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="380" fill="#f7f9fc"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#1677ff">支付下单时序图</text>

  <!-- actors -->
  <rect x="10" y="50" width="90" height="34" rx="6" fill="#e6f0ff" stroke="#1677ff"/>
  <text x="55" y="72" font-size="11" text-anchor="middle" fill="#333">前端</text>
  <rect x="190" y="50" width="90" height="34" rx="6" fill="#fff7e6" stroke="#fa8c16"/>
  <text x="235" y="72" font-size="11" text-anchor="middle" fill="#333">业务服务</text>
  <rect x="370" y="50" width="90" height="34" rx="6" fill="#f9f0ff" stroke="#722ed1"/>
  <text x="415" y="72" font-size="11" text-anchor="middle" fill="#333">支付核心</text>
  <rect x="560" y="50" width="120" height="34" rx="6" fill="#fff1f0" stroke="#f5222d"/>
  <text x="620" y="72" font-size="11" text-anchor="middle" fill="#333">支付宝/微信</text>

  <!-- lifelines -->
  <line x1="55" y1="84" x2="55" y2="360" stroke="#ccc"/>
  <line x1="235" y1="84" x2="235" y2="360" stroke="#ccc"/>
  <line x1="415" y1="84" x2="415" y2="360" stroke="#ccc"/>
  <line x1="620" y1="84" x2="620" y2="360" stroke="#ccc"/>

  <!-- messages -->
  <g font-size="11" fill="#333">
    <line x1="55" y1="110" x2="233" y2="110" stroke="#1677ff" marker-end="url(#ar)"/>
    <text x="100" y="104">1 创建订单 POST /api/pay/create</text>

    <line x1="235" y1="140" x2="413" y2="140" stroke="#722ed1" marker-end="url(#ar)"/>
    <text x="270" y="134">2 unifiedPayService.pay()</text>

    <line x1="415" y1="170" x2="618" y2="170" stroke="#f5222d" marker-end="url(#ar)"/>
    <text x="450" y="164">3 下单(签名/加密)</text>

    <line x1="618" y1="200" x2="417" y2="200" stroke="#f5222d" marker-end="url(#ar)"/>
    <text x="450" y="194">4 返回二维码/跳转URL</text>

    <line x1="413" y1="230" x2="237" y2="230" stroke="#722ed1" marker-end="url(#ar)"/>
    <text x="300" y="224">5 PayOrderResult</text>

    <line x1="233" y1="260" x2="57" y2="260" stroke="#1677ff" marker-end="url(#ar)"/>
    <text x="110" y="254">6 展示二维码/跳转支付</text>

    <line x1="55" y1="300" x2="55" y2="320" stroke="#999"/>
    <text x="80" y="318" fill="#999">7 用户扫码/确认支付(渠道侧)</text>
    <text x="80" y="340" fill="#999">8 渠道异步回调 → /callback/{channel}/{mch}</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
