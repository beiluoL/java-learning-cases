spring:
  datasource:
    # H2 内存库，零配置：无需安装任何数据库即可运行（重启后数据清空）
    url: jdbc:h2:mem:spring_vue_learn;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  h2:
    console:
      enabled: true
