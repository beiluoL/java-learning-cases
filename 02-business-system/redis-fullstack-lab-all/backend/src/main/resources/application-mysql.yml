# 生产 profile：切换到 MySQL。
# 启动方式：java -jar redis-fullstack-lab.jar --spring.profiles.active=mysql
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/redislab?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: never     # 生产环境不要自动执行建表脚本
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
