# Redis 全栈实战项目依赖：Redis 7（开启 AOF 持久化）+ 可选 RedisInsight 可视化管理
services:
  redis:
    image: redis:7
    container_name: redis-fullstack-lab
    ports:
      - "6379:6379"
    # 开启 AOF，保证数据持久化，重启不丢
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight-fullstack-lab
    ports:
      - "8001:8001"
    depends_on:
      - redis

volumes:
  redis-data:
