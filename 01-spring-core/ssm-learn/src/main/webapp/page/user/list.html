<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>用户管理</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="layui-fluid">
    <!-- 搜索栏 -->
    <form class="layui-form layui-row layui-col-space10" id="searchForm" style="margin-bottom:10px;">
        <div class="layui-col-md3">
            <input class="layui-input" name="username" placeholder="用户名" autocomplete="off">
        </div>
        <div class="layui-col-md3">
            <select name="status">
                <option value="">状态</option>
                <option value="1">启用</option>
                <option value="0">禁用</option>
            </select>
        </div>
        <div class="layui-col-md3">
            <button class="layui-btn" lay-submit lay-filter="search">查询</button>
            <button type="reset" class="layui-btn layui-btn-primary">重置</button>
        </div>
    </form>

    <!-- 表格工具栏 -->
    <script type="text/html" id="toolbar">
        <button class="layui-btn layui-btn-sm" lay-event="add">新增用户</button>
        <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="delBatch">批量删除</button>
    </script>
    <script type="text/html" id="rowTool">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    </script>

    <table id="userTable" lay-filter="userTable"></table>
</div>

<!-- 新增/编辑表单弹窗 -->
<div id="formDialog" style="display:none;padding:20px 30px 0 0;">
    <form class="layui-form" id="userForm" lay-filter="userForm">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
                <input class="layui-input" name="username" lay-verify="required" placeholder="请输入用户名">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">真实姓名</label>
            <div class="layui-input-block">
                <input class="layui-input" name="realName" placeholder="请输入真实姓名">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input class="layui-input" name="email" placeholder="请输入邮箱">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input class="layui-input" name="phone" placeholder="请输入手机号">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <input type="radio" name="status" value="1" title="启用" checked>
                <input type="radio" name="status" value="0" title="禁用">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="save">保存</button>
                <button type="button" class="layui-btn layui-btn-primary" id="cancelBtn">取消</button>
            </div>
        </div>
    </form>
</div>

<script src="/static/layui/layui.js"></script>
<script src="/static/js/common.js"></script>
<script>
    layui.use(['table', 'form', 'layer'], function () {
        var table = layui.table, form = layui.form, layer = layui.layer;
        var $ = layui.$; // Layui 内置 jQuery，避免全局 $ 未定义的报错

        var tableIns = table.render({
            elem: '#userTable',
            url: ctx + '/api/user/list',
            toolbar: '#toolbar',
            page: true,
            cols: [[
                {type: 'checkbox'},
                {field: 'id', title: 'ID', width: 80},
                {field: 'username', title: '用户名'},
                {field: 'realName', title: '真实姓名'},
                {field: 'email', title: '邮箱'},
                {field: 'phone', title: '手机号'},
                {
                    field: 'status', title: '状态', width: 100,
                    templet: function (d) {
                        return d.status === 1
                            ? '<span class="layui-badge layui-bg-green">启用</span>'
                            : '<span class="layui-badge layui-bg-gray">禁用</span>';
                    }
                },
                {field: 'createTime', title: '创建时间', width: 170},
                {title: '操作', toolbar: '#rowTool', width: 140}
            ]]
        });

        // 搜索
        form.on('submit(search)', function (data) {
            tableIns.reload({where: data.field, page: {curr: 1}});
            return false;
        });

        // 顶部工具栏
        table.on('toolbar(userTable)', function (obj) {
            if (obj.event === 'add') {
                openForm();
            }
            if (obj.event === 'delBatch') {
                var check = table.checkStatus('userTable').data;
                if (!check.length) return layer.msg('请选择要删除的记录');
                var ids = check.map(function (i) { return i.id; });
                layer.confirm('确定删除选中的 ' + ids.length + ' 条记录？', function () {
                    request('/api/user/batch', {method: 'DELETE', data: ids}).then(function (res) {
                        if (res.code === 0) { layer.msg('删除成功'); tableIns.reload(); }
                        else layer.msg(res.msg);
                    });
                });
            }
        });

        // 行工具栏
        table.on('tool(userTable)', function (obj) {
            var data = obj.data;
            if (obj.event === 'edit') {
                openForm(data);
            }
            if (obj.event === 'del') {
                layer.confirm('确定删除该用户？', function () {
                    request('/api/user/' + data.id, {method: 'DELETE'}).then(function (res) {
                        if (res.code === 0) { layer.msg('删除成功'); tableIns.reload(); }
                        else layer.msg(res.msg);
                    });
                });
            }
        });

        // 打开表单弹窗（row 为空=新增，有值=编辑）
        function openForm(row) {
            layer.open({
                type: 1,
                title: row ? '编辑用户' : '新增用户',
                area: ['500px'],
                content: $('#formDialog'),
                success: function () {
                    form.val('userForm', row || {});
                    if (row && row.status === 0) {
                        $('input[name=status][value=0]').prop('checked', true);
                        form.render();
                    }
                }
            });
        }

        // 保存（新增 POST，编辑 PUT）
        form.on('submit(save)', function (data) {
            var field = data.field;
            field.status = parseInt(field.status, 10);
            var method = field.id ? 'PUT' : 'POST';
            request('/api/user', {method: method, data: field}).then(function (res) {
                if (res.code === 0) {
                    layer.msg('保存成功');
                    layer.closeAll();
                    tableIns.reload();
                } else {
                    layer.msg(res.msg);
                }
            });
            return false;
        });

        $('#cancelBtn').click(function () { layer.closeAll(); });
    });
</script>
</body>
</html>
