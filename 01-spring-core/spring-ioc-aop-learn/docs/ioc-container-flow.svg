<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 660" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box { fill:#EAF2FB; stroke:#1677ff; stroke-width:1.5; rx:8; }
      .box2 { fill:#FFF7E6; stroke:#d48806; stroke-width:1.5; rx:8; }
      .box3 { fill:#F6FFED; stroke:#389e0d; stroke-width:1.5; rx:8; }
      .title { fill:#1677ff; font-size:18px; font-weight:700; }
      .h { fill:#1f2329; font-size:14px; font-weight:700; }
      .t { fill:#3a3f47; font-size:12px; }
      .arrow { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="340" y="30" text-anchor="middle" class="title">IoC 容器启动与 Bean 生命周期（源码级流程）</text>

  <!-- Row 1: config + reader -->
  <rect x="60" y="55" width="200" height="56" class="box2"/>
  <text x="160" y="80" text-anchor="middle" class="h">XML 配置</text>
  <text x="160" y="98" text-anchor="middle" class="t">ioc-demo.xml / aop-demo.xml</text>

  <rect x="420" y="55" width="200" height="56" class="box"/>
  <text x="520" y="80" text-anchor="middle" class="h">XmlBeanDefinitionReader</text>
  <text x="520" y="98" text-anchor="middle" class="t">解析 DOM → BeanDefinition</text>

  <path d="M260,83 L420,83" class="arrow"/>

  <!-- Row 2: registry -->
  <rect x="420" y="140" width="200" height="56" class="box"/>
  <text x="520" y="165" text-anchor="middle" class="h">BeanDefinitionRegistry</text>
  <text x="520" y="183" text-anchor="middle" class="t">beanDefinitionMap 缓存“配方”</text>

  <path d="M520,111 L520,140" class="arrow"/>

  <!-- Row 3: getBean -->
  <rect x="420" y="225" width="200" height="50" class="box3"/>
  <text x="520" y="255" text-anchor="middle" class="h">BeanFactory.getBean()</text>

  <path d="M520,196 L520,225" class="arrow"/>

  <!-- Row 4: createBean steps -->
  <rect x="60" y="300" width="200" height="64" class="box"/>
  <text x="160" y="324" text-anchor="middle" class="h">① 实例化</text>
  <text x="160" y="343" text-anchor="middle" class="t">构造器注入 / 无参 new</text>

  <rect x="290" y="300" width="200" height="64" class="box"/>
  <text x="390" y="324" text-anchor="middle" class="h">② 属性填充</text>
  <text x="390" y="343" text-anchor="middle" class="t">Setter 注入（DI）</text>

  <rect x="520" y="300" width="200" height="64" class="box"/>
  <text x="620" y="324" text-anchor="middle" class="h">③ 初始化</text>
  <text x="620" y="343" text-anchor="middle" class="t">Aware→Init→BPP</text>

  <path d="M260,250 L160,300" class="arrow"/>
  <path d="M260,332 L290,332" class="arrow"/>
  <path d="M490,332 L520,332" class="arrow"/>

  <!-- init detail -->
  <rect x="520" y="395" width="200" height="120" class="box2"/>
  <text x="620" y="418" text-anchor="middle" class="h">initializeBean()</text>
  <text x="620" y="440" text-anchor="middle" class="t">· BeanFactoryAware</text>
  <text x="620" y="460" text-anchor="middle" class="t">· InitializingBean</text>
  <text x="620" y="480" text-anchor="middle" class="t">· BPP before</text>
  <text x="620" y="500" text-anchor="middle" class="t">· BPP after ★AOP织入</text>

  <path d="M620,364 L620,395" class="arrow"/>

  <!-- singleton cache -->
  <rect x="290" y="560" width="200" height="56" class="box3"/>
  <text x="390" y="585" text-anchor="middle" class="h">单例缓存 / 返回</text>
  <text x="390" y="603" text-anchor="middle" class="t">可能是 AOP 代理对象</text>

  <path d="M520,515 L390,560" class="arrow"/>
  <path d="M390,364 L390,560" class="arrow" stroke-dasharray="4,3"/>
</svg>
