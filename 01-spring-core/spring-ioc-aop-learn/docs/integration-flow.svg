<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .box { fill:#EAF2FB; stroke:#1677ff; stroke-width:1.5; }
      .box2 { fill:#F6FFED; stroke:#389e0d; stroke-width:1.5; }
      .box3 { fill:#FFF7E6; stroke:#d48806; stroke-width:1.5; }
      .box4 { fill:#F9F0FF; stroke:#722ed1; stroke-width:1.5; }
      .title { fill:#1677ff; font-size:18px; font-weight:700; }
      .h { fill:#1f2329; font-size:13.5px; font-weight:700; }
      .t { fill:#3a3f47; font-size:11.5px; }
      .arrow { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="340" y="30" text-anchor="middle" class="title">IoC + AOP 整合：BeanPostProcessor 把切面织入容器</text>

  <rect x="30" y="70" width="180" height="70" class="box"/>
  <text x="120" y="95" text-anchor="middle" class="h">① 启动容器</text>
  <text x="120" y="114" text-anchor="middle" class="t">加载 XML → 注册</text>
  <text x="120" y="130" text-anchor="middle" class="t">BeanDefinition</text>

  <rect x="250" y="70" width="180" height="70" class="box3"/>
  <text x="340" y="95" text-anchor="middle" class="h">② 注册 BPP</text>
  <text x="340" y="114" text-anchor="middle" class="t">实例化并注册</text>
  <text x="340" y="130" text-anchor="middle" class="t">DefaultAdvisorAutoProxyCreator</text>

  <rect x="470" y="70" width="180" height="70" class="box"/>
  <text x="560" y="95" text-anchor="middle" class="h">③ 预实例化单例</text>
  <text x="560" y="114" text-anchor="middle" class="t">getBean → createBean</text>
  <text x="560" y="130" text-anchor="middle" class="t">实例化+注入+初始化</text>

  <path d="M210,105 L250,105" class="arrow"/>
  <path d="M430,105 L470,105" class="arrow"/>

  <!-- postProcessAfterInitialization -->
  <rect x="250" y="180" width="360" height="70" class="box4"/>
  <text x="430" y="205" text-anchor="middle" class="h">④ postProcessAfterInitialization(bean)</text>
  <text x="430" y="226" text-anchor="middle" class="t">从容器取出所有 Advisor，判断当前 Bean 的方法是否被切点命中</text>
  <text x="430" y="244" text-anchor="middle" class="t">命中 → ProxyFactory 包装成代理；未命中 → 原样返回</text>

  <path d="M560,140 L430,180" class="arrow"/>
  <path d="M430,140 L340,140 L340,180" class="arrow"/>

  <!-- outcome: two beans -->
  <rect x="30" y="300" width="290" height="70" class="box2"/>
  <text x="175" y="325" text-anchor="middle" class="h">客户端 getBean 拿到原始 Bean</text>
  <text x="175" y="344" text-anchor="middle" class="t">未命中切点（如 userDao）</text>
  <text x="175" y="360" text-anchor="middle" class="t">仍是普通对象</text>

  <rect x="360" y="300" width="290" height="70" class="box4"/>
  <text x="505" y="325" text-anchor="middle" class="h">客户端 getBean 拿到 AOP 代理</text>
  <text x="505" y="344" text-anchor="middle" class="t">命中切点（userService / orderService）</text>
  <text x="505" y="360" text-anchor="middle" class="t">调用即走拦截器链（增强）</text>

  <path d="M430,250 L175,300" class="arrow"/>
  <path d="M430,250 L505,300" class="arrow"/>
</svg>
